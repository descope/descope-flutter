group 'com.descope.flutter'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.2.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // Interim source: descope-kotlin fork's onError fix, until descope/descope-kotlin#362
        // merges & releases officially — see the dependency below and
        // docs/task_spec_sso_onerror_sdk_patch.md in moma_2.
        maven { url 'https://jitpack.io' }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "com.descope.flutter"
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdk 24
        targetSdk 36
    }

    dependencies {
        implementation "androidx.browser:browser:1.8.0"
        implementation "androidx.security:security-crypto:1.1.0"
        implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
        // Interim fork (fix/flow-scriptlet-onerror @ script972/descope-kotlin), built via JitPack,
        // pending upstream PR descope/descope-kotlin#362. Revert to the official coordinate above
        // once that merges & releases.
        implementation "com.github.script972.descope-kotlin:descopesdk:042ed3540244795ed1b45fa5a1a1a0e85e5e549c"
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
