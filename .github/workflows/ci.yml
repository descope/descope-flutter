name: CI

on: pull_request

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: dart analyze
      - name: Test
        run: flutter test

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
      - name: Generate example platform files
        working-directory: example
        run: flutter create --platforms=android --project-name=descope_example .
      - name: Dependencies
        working-directory: example
        run: flutter pub get
      - name: Build
        working-directory: example
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build.log
          if grep -q "apply Kotlin Gradle Plugin (KGP): .*descope" build.log; then
            echo "::error::The descope plugin still applies the Kotlin Gradle Plugin"
            exit 1
          fi

  build-ios:
    name: Build iOS (${{ matrix.integration }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - integration: CocoaPods
            spm_flag: '--no-enable-swift-package-manager'
          - integration: SwiftPM
            spm_flag: '--enable-swift-package-manager'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
      - name: Select native integration
        run: flutter config ${{ matrix.spm_flag }}
      - name: Generate example platform files
        working-directory: example
        run: flutter create --platforms=ios --project-name=descope_example .
      - name: Dependencies
        working-directory: example
        run: flutter pub get
      - name: Build
        working-directory: example
        run: flutter build ios --debug --no-codesign
